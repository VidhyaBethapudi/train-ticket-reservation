name: Train Ticket Reservation CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:


jobs:
  build-and-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Java
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Verify Maven installation
      - name: Check Maven version
        run: mvn --version

      # Step 4: Validate Maven project
      - name: Validate with Maven
        run: mvn validate

      # Step 5: Compile Java code
      - name: Compile with Maven
        run: mvn compile

      # Step 6: Run tests
      - name: Test with Maven
        run: mvn test

      # Step 7: Package application
      - name: Package with Maven
        run: mvn package

      # Step 8: Verify generated files
      - name: Verify build artifacts
        run: ls -lh target/

      # Step 9: Configure AWS credentials
      - name: Configure AWS Credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 10: Log in to Amazon ECR
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 11: Set up Docker Buildx
      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/setup-buildx-action@v3

      # Step 12: Build and push Docker image
      - name: Build and Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA} $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
